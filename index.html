<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI Video Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
  min-height: 100vh;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 30px 18px;
}

h1 {
  text-align: center;
  font-size: 32px;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #aeb7c7;
  margin-bottom: 30px;
}

.box {
  background: #151c2e;
  padding: 20px;
  border-radius: 18px;
  border: 1px solid #29334a;
}

label {
  display: block;
  margin: 15px 0 8px;
  font-size: 16px;
}

textarea,
select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #39445c;
  background: #0d1424;
  color: white;
  font-size: 16px;
}

textarea {
  height: 150px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #6c5ce7;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

button:active {
  transform: scale(0.98);
}

#message {
  margin-top: 20px;
  text-align: center;
  line-height: 1.7;
}

#videoBox {
  margin-top: 25px;
  display: none;
}

video {
  width: 100%;
  border-radius: 15px;
}

.success {
  color: #6cff9a;
}

.error {
  color: #ff7070;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 My AI Video Maker</h1>

<div class="subtitle">
اپنی کہانی لکھیں اور AI ویڈیو بنائیں
</div>

<div class="box">

<label>📝 اپنی کہانی / Prompt</label>

<textarea id="prompt"
placeholder="مثال: ایک خوبصورت گاؤں میں ایک بچہ اپنی امی کی مدد کرتا ہے..."></textarea>

<label>🌐 Language</label>

<select id="language">
<option value="Urdu">Urdu</option>
<option value="Hindi">Hindi</option>
<option value="English">English</option>
</select>

<label>🎨 Style</label>

<select id="style">
<option value="3D cartoon">3D Cartoon</option>
<option value="Realistic">Realistic</option>
<option value="Anime">Anime</option>
<option value="Cinematic">Cinematic</option>
</select>

<label>📱 Format</label>

<select id="format">
<option value="9:16">9:16 YouTube Shorts</option>
<option value="16:9">16:9 YouTube</option>
<option value="1:1">1:1 Square</option>
</select>

<button onclick="generateVideo()">
🚀 Generate Video
</button>

<div id="message"></div>

<div id="videoBox">
<video id="resultVideo" controls></video>
</div>

</div>
</div>

<script>

const WORKER_URL =
"https://raspy-cloud-29c4.rehanlala844.workers.dev";

async function generateVideo() {

  const prompt = document.getElementById("prompt").value.trim();
  const language = document.getElementById("language").value;
  const style = document.getElementById("style").value;
  const format = document.getElementById("format").value;

  const message = document.getElementById("message");
  const videoBox = document.getElementById("videoBox");

  videoBox.style.display = "none";

  if (!prompt) {
    message.className = "error";
    message.innerText = "⚠️ پہلے اپنی کہانی لکھیں۔";
    return;
  }

  message.className = "";
  message.innerText = "⏳ AI آپ کی ویڈیو تیار کر رہا ہے...";

  let finalPrompt =
    `${prompt}. Style: ${style}. Language: ${language}. Create a high quality video.`;

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        prompt: finalPrompt,
        ratio: format,
        duration: 5
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || data.message || "Runway request failed"
      );
    }

    if (!data.id) {
      throw new Error("Runway نے task ID نہیں دیا۔");
    }

    await checkTask(data.id);

  } catch (error) {

    console.error(error);

    message.className = "error";

    message.innerText =
      "❌ Error: " + error.message;

  }
}


async function checkTask(taskId) {

  const message = document.getElementById("message");

  for (let i = 0; i < 60; i++) {

    await new Promise(resolve =>
      setTimeout(resolve, 5000)
    );

    try {

      const response = await fetch(
        WORKER_URL + "?taskId=" +
        encodeURIComponent(taskId)
      );

      const data = await response.json();

      console.log(data);

      if (
        data.status === "SUCCEEDED" ||
        data.status === "succeeded"
      ) {

        const output =
          data.output &&
          data.output[0];

        if (output) {

          document.getElementById("resultVideo").src =
            output;

          document.getElementById("videoBox")
            .style.display = "block";

          message.className = "success";

          message.innerText =
            "🎉 آپ کی ویڈیو تیار ہے!";

          return;
        }
      }

      if (
        data.status === "FAILED" ||
        data.status === "failed"
      ) {

        throw new Error(
          data.failure ||
          data.error ||
          "Video generation failed"
        );
      }

      message.innerText =
        "⏳ ویڈیو بن رہی ہے... " +
        Math.round((i + 1) * 5) +
        " سیکنڈ";

    } catch (error) {

      message.className = "error";

      message.innerText =
        "❌ " + error.message;

      return;
    }
  }

  message.className = "error";

  message.innerText =
    "⏰ ویڈیو بنانے میں زیادہ وقت لگ رہا ہے۔";
}

</script>

</body>
</html>
